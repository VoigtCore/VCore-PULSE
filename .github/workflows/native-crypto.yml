name: Build native database adapters
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm, macos-15-intel, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential tcl-dev libssl-dev python3
      - name: Compile and verify open-source adapter
        run: bash tools/native-crypto/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sqlcipher-${{ matrix.runner }}
          path: native-output/
          if-no-files-found: error
          retention-days: 14
